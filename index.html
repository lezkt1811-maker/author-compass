<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Author Compass — Never Wonder If Your Book Is Ready</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- decorative firefly lights layer -->
  <div id="fireflies" class="fireflies"></div>

  <div class="topbar">
    <button id="hamburgerBtn" class="icon-btn" aria-label="Open menu">☰</button>
    <div class="logo"><span class="logo-mark">✦</span><span class="logo-text">Author Compass</span></div>
    <span style="width:24px"></span>
  </div>

  <div id="drawerOverlay" class="drawer-overlay hidden"></div>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-head">
      <div class="logo">
        <span class="logo-mark">✦</span>
        <div>
          <div class="logo-text">Author Compass</div>
          <div class="logo-sub">Never wonder if your book is ready</div>
        </div>
      </div>
      <button id="closeDrawerBtn" class="icon-btn close-only" aria-label="Close menu">✕</button>
    </div>
    <div id="bookSwitcher" class="book-switcher"></div>
    <nav id="nav" class="nav"></nav>
  </aside>

  <main id="app" class="app"></main>

  <script src="app.js"></script>
</body>
</html>
